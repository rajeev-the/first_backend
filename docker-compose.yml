services:
  # PostgreSQL with PostGIS extension support
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: first_choose_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: first_choose
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d first_choose"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: first_choose_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
